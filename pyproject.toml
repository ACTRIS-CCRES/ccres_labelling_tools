[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "ccres-labelling-tools"
version = "0.0.1"
description = "A ACTRIS-CCRES package containing tools used to label nNational Facilities"
readme = "README.md"
license = "AGPL-3.0"
maintainers = [
  { name = "Jean-Francois Ribaud", email = "jean-francois.ribaud@ipsl.fr" },
]
authors = [
  { name = "Jean-Francois Ribaud", email = "jean-francois.ribaud@ipsl.fr" },
]
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "click>=8.5",
  "matplotlib>=3.11.2",
  "numpy>=2.5.3",
  "pandas>=3.0.5",
  "requests>=2.34.2",
]
scripts.run-get-data-coverage-cloudnet = "ccres_labelling_tools.coverage.cli:main"

[dependency-groups]
dev = [
  "commitizen>=4.13.8",
  "pre-commit>=4.5.1",
  "pyproject-fmt>=2.29.4",
  "pytest>=9.0.2",
  "pytest-cov>=7",
  "ruff>=0.15.2",
  "ty>=0.0.16",
]
docs = [ "mkdocstrings-python", "zensical" ]

[tool.hatch]
build.targets.wheel.packages = [ "src/ccres_labelling_tools" ]

[tool.ruff]
line-length = 88
# 88 is the standard line length
lint.select = [ "ALL" ]
lint.ignore = [
  "B008",   # Typer's Option() and Argument() are intentionally used as default values.
  "COM812", # Conflicts with the formatter.
  "CPY001", # Do not require copyright notices.
  "D4",     # Ignore docstring content and style conventions.
  "D105",   # Allow missing magic method docstrings.
  "D106",   # Allow missing nested class docstrings.
  "D203",   # Incompatible with D211.
  "D213",   # Incompatible with D212.
  "FIX002", # Allow TODO comments.
  "LOG015", # Allow calls to the root logger.
  "PLR",    # Ignore design-related recommendations (e.g. too many arguments).
  "T20",    # Allow print statements.
  "TD002",  # Do not require TODO author attribution.
  "TD003",  # Do not require TODO issue links.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "ANN",     # Type annotations are optional in tests.
  "ARG",     # Allow unused arguments in fixtures and mocks.
  "PLR2004", # Allow magic values in test assertions.
  "S101",    # Allow assert statements.
]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = """\
  --cov=. --cov-config=pyproject.toml -vv --cov-report=html:htmlcov --cov-report=xml:coverage.xml --cov-report term\
  """
ini_options.filterwarnings = [ "ignore::RuntimeWarning", "ignore::DeprecationWarning" ]

[tool.coverage]
run.source = [ "src/", "tests/" ]
run.omit = [ "*.pyx" ]
run.branch = true
run.parallel = true
report.exclude_also = [
  "@(abc\\.)?abstractmethod",
  "@overload",
  "@typing.overload",
  "\\.\\.\\.",
  "class .*\\bProtocol\\):",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
  "raise NotImplementedError",
]
report.skip_covered = true
report.show_missing = true

[tool.commitizen]
version_provider = "uv"
bump_message = "chore: bump version $current_version → $new_version"
retry_after_failure = true
tag_format = "v$version"
annotated_tag = true
annotated_tag_message = "Release $new_version"
changelog_file = "CHANGELOG.md"
update_changelog_on_bump = true
pre_bump_hooks = []
post_bump_hooks = []
